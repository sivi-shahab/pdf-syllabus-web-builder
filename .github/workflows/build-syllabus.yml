name: Build & Deploy Syllabus Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment (ERNIE + PaddleOCR-VL)
        run: |
          echo "ERNIE_API_KEY=${{ secrets.ERNIE_API_KEY }}" >> $GITHUB_ENV
          echo "PADDLE_VL_API_URL=${{ secrets.PADDLE_VL_API_URL }}" >> $GITHUB_ENV
          echo "PADDLE_VL_TOKEN=${{ secrets.PADDLE_VL_TOKEN }}" >> $GITHUB_ENV

      - name: Build syllabus site from PDF
        run: |
          python -m backend.cli_build_syllabus \
            --pdf input/syllabus.pdf \
            --title "Course Syllabus"

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
